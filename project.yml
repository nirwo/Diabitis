# Fallback: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`)
name: BariatricHabits
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
targets:
  BariatricHabits:
    type: application
    platform: iOS
    sources: [BariatricHabits]
    entitlements:
      path: BariatricHabits.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nirwo.bariatrichabits
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "הרגלים"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "האפליקציה קוראת את מספר הצעדים כדי להציג את ההתקדמות היומית וההליכות שלך."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "האפליקציה אינה כותבת נתונים לאפליקציית בריאות."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
