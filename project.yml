# Fallback: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`)
name: BariatricHabits
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
targets:
  BariatricHabits:
    type: application
    platform: iOS
    sources: [BariatricHabits]
    entitlements:
      path: BariatricHabits.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nirwo.bariatrichabits
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "הרגלים"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "האפליקציה קוראת את מספר הצעדים כדי להציג את ההתקדמות היומית וההליכות שלך."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "האפליקציה אינה כותבת נתונים לאפליקציית בריאות."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
  BariatricHabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BariatricHabitsTests]
    dependencies:
      - target: BariatricHabits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.nirwo.bariatrichabits.tests
schemes:
  BariatricHabits:
    build:
      targets:
        BariatricHabits: all
        BariatricHabitsTests: [test]
    test:
      targets: [BariatricHabitsTests]
